# Canonical governance checker.
#
# Runs the project test-suite first (so the checker's own tests must pass),
# then runs the governance checker over the repository. The checker fails
# closed: any finding or internal error exits non-zero and fails the job.
name: Governance checker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the job only needs to read the checked-out code.
permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run tests
      run: pytest -q
    - name: Run governance checker
      run: python governance_checker.py --root .
